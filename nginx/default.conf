resolver 127.0.0.11 valid=30s;

# 1. HTTP to HTTPS Auto-Redirect
server {
    listen 80;
    server_name medisonpatuakhali.com www.medisonpatuakhali.com localhost 72.60.204.20;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Configuration
server {
    listen 443 ssl;
    server_name medisonpatuakhali.com www.medisonpatuakhali.com;

    ssl_certificate /etc/letsencrypt/live/medisonpatuakhali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medisonpatuakhali.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. React Frontend (SPA Routing)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Django API Routes (সংশোধিত proxy_pass)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. Django Admin Route (সংশোধিত proxy_pass)
    location /medison_dashboard_management/ {
        proxy_pass http://backend:8000/medison_dashboard_management/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Django Static Files (CSS, JS)
    location /django_static/ {
        alias /app/staticfiles/;
    }

    # 5. Django Media Files (Images)
    location /media/ {
        alias /app/media/;
    }
}