server {
    listen 80;
    client_max_body_size 100M;
    server_name medisonpatuakhali.com www.medisonpatuakhali.com;
    client_max_body_size 20M;

    # Docker internal DNS, protibar nam notun kore resolve korbe
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://medison-backend:8000;

    # React Frontend (SPA Routing)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Django API Routes
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django Admin Route
    location /medison_dashboard_management/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django Static Files
    location /django_static/ {
        alias /app/staticfiles/;
    }

    # Django Media Files
    location /media/ {
        alias /app/media/;
    }
}