version: '3.8'

services:
  db:
    image: mysql:8.0
    #container_name: medison_db
    restart: always
    environment:
      MYSQL_DATABASE: medison_db
      MYSQL_USER: medison_user
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    #container_name: medison_backend
    restart: always
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    environment:
      - DEBUG=0
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    #container_name: medison_frontend
    restart: always
    volumes:
      - react_build:/app/build


  nginx:
    image: nginx:alpine
    #container_name: medison_nginx
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - react_build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend

volumes:
  static_volume:
  media_volume:
  mysql_data:
  react_build: